[project]
name = "worldcal"
version = "0.1.0"
description = "Demographic calibration of open-ended LLM generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kurt M. Boden" }]
dependencies = [
  "pydantic>=2.7",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
